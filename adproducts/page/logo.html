        <script>
           document.querySelectorAll('.card').forEach(card => {
    const preview = card.querySelector('.previewImage');
    const downloadBtn = card.querySelector('.downloadBtn');
    const buttons = card.querySelectorAll('button[data-image]');

    buttons.forEach(btn => {
        btn.addEventListener("click", function() {
            // Ganti gambar
            const imgName = this.getAttribute("data-image");
            const newPath = "assets/logo/" + imgName;
            preview.src = newPath;
            downloadBtn.href = newPath;

            // Reset active state
            buttons.forEach(b => b.classList.remove('btn-active'));

            // Set active to clicked
            this.classList.add('btn-active');
        });
    });
});
