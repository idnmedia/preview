<div style="position: absolute; width: 320px; height: 480px; background-color: white; border-radius: 10px; left: 0; right: 0; margin: auto;">

    <span style="position: absolute; font-size: 13px; z-index: 2; color: #ea0b2b; background-color: #fff; border: 2px solid #ea0b2b; left: 0px; right: 0px; margin: auto; border-radius: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; bottom: 21px; padding: 3px; width: 300px; font-family: 'poppins', sans-serif; font-weight: 500;">TONTON FULL EPISODE-NYA DI <img src="https://ads.idn.media/products/page/assets/logo/idnapp/color.png" style="max-width: 20px; height: auto;"></span>
    <video id="videoInBanner" controls loop muted playsinline preload="none" style="width: 320px; height: 420px; position: absolute; z-index: 1; background-color: black; left: 0; right: 0; margin: auto;">
        <source src="video3.mp4" type="video/mp4">
    </video>   
</div>

<script>
(function() {
    var video = document.getElementById('videoInBanner');
    if (!video) return;

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                video.play().catch(function(){});
            } else {
                video.pause();
            }
        });
    }, {
        threshold: [0.5]
    });

    observer.observe(video);
})();
</script>
