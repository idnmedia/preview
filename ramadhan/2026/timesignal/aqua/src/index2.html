<script src="app.js"></script>
<script>
const interval = setInterval(() => {

    // ID idnads_header_leaderboard
    parent.document
        .querySelectorAll('[id^="idnads_header_leaderboard"]')
        .forEach(el => {
            el.style.setProperty('height', '340px', 'important');
        });

    // Class css-13bgxac
    parent.document
        .querySelectorAll('.css-13bgxac')
        .forEach(el => {
            el.style.setProperty('height', '340px', 'important');
        });

    // ID div-gpt-ad-leaderboard
    const ads = parent.document.querySelectorAll('[id^="div-gpt-ad-leaderboard"]');

    if (ads.length > 0) {
        ads.forEach(el => {
            el.style.setProperty('max-height', '340px', 'important');
        });

        clearInterval(interval); // stop kalau udah ketemu
    }

}, 200);
</script>
<script type="text/javascript">
if(top!=self){
    window.frameElement.style = 'width: 320px; height: 320px; margin-top: 5px; position: relative;';
};
</script>
    
</body>
